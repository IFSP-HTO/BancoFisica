name: Importar figuras originais de optica (ENEM 2015 e ENADE 2024)

on:
  push:
    branches:
      - adicionar-enem2015-enade2024-camara-escura
    paths:
      - .github/workflows/importar-figuras-optica.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar extracao
        run: python -m pip install --disable-pip-version-check pymupdf
      - name: Extrair JPEGs originais diretamente dos PDFs do INEP
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import pathlib
          import urllib.request
          import fitz

          targets = [
              (
                  "https://download.inep.gov.br/educacao_basica/enem/provas/2015/2015_PV_impresso_D1_CD1.pdf",
                  28, 151,
                  "BancoDeQuestoes/figuras/enem2015_alhazen_camara_escura.jpg",
                  "b7495f261e7a500b9b411ae7002348587ae6d9b54e998d0e433ce931210f4ef8",
              ),
              (
                  "https://download.inep.gov.br/enade/provas_e_gabaritos/2024_Fisica_PV_1.pdf",
                  35, 102,
                  "BancoDeQuestoes/figuras/enade2024_eclipse_folhas_original.jpeg",
                  "cdfe7bd22a14bb5f6cda5811c839e85e41349afdb00ce2eac4da020351bd5588",
              ),
          ]
          for url, page_number, xref, destination, expected_sha256 in targets:
              print("Obtendo PDF oficial:", url, flush=True)
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 BancoFisica/1.0"})
              with urllib.request.urlopen(request, timeout=90) as response:
                  pdf_bytes = response.read()
              with fitz.open(stream=pdf_bytes, filetype="pdf") as document:
                  assert xref in [img[0] for img in document[page_number].get_images(full=True)]
                  image = document.extract_image(xref)
                  assert image["ext"].lower() in ("jpg", "jpeg")
                  contents = image["image"]
              digest = hashlib.sha256(contents).hexdigest()
              if digest != expected_sha256:
                  raise RuntimeError(f"Imagem inesperada: {destination}; sha256={digest}")
              output = pathlib.Path(destination)
              output.parent.mkdir(parents=True, exist_ok=True)
              output.write_bytes(contents)
              print("Extraida com fidelidade:", output, len(contents), digest, flush=True)
          PY
      - name: Versionar imagens originais
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BancoDeQuestoes/figuras/enem2015_alhazen_camara_escura.jpg BancoDeQuestoes/figuras/enade2024_eclipse_folhas_original.jpeg
          git diff --cached --quiet && exit 0
          git commit -m "Inclui imagens originais ENEM 2015 e ENADE 2024"
          git push origin HEAD:adicionar-enem2015-enade2024-camara-escura
