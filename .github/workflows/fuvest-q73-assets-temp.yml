name: FUVEST Q73 asset extraction

on:
  push:
    branches:
      - fuvest-2026-q73-fiel
    paths:
      - .github/workflows/fuvest-q73-assets-temp.yml

permissions:
  contents: write

jobs:
  extract-q73:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fuvest-2026-q73-fiel
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: python -m pip install pymupdf
      - name: Download official FUVEST 2026 V1 PDF
        run: |
          curl -L --fail --retry 5 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            'https://www.fuvest.br/wp-content/uploads/fuvest2026-fase1-prova-V1.pdf' \
            -o /tmp/fuvest2026-fase1-prova-V1.pdf
      - name: Crop original Q73 figure
        run: |
          python tools/pdf_assets.py crop /tmp/fuvest2026-fase1-prova-V1.pdf \
            --page 31 \
            --bbox-percent 53 20.5 96 46.5 \
            --dpi 300 \
            --output BancoDeQuestoes/figuras/Q24QuizFUVEST2026EquilibrioColher.png \
            --provenance --force
      - name: Commit extracted asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BancoDeQuestoes/figuras/Q24QuizFUVEST2026EquilibrioColher.png*
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'assets: extrai figura original FUVEST 2026 Q73'
            git push origin HEAD:fuvest-2026-q73-fiel
          fi
