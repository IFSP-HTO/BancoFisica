name: Lançamento oblíquo — listas 2026

on:
  pull_request:
    branches: [master]
    paths:
      - "BancoDeQuestoes/cinematica/lancamentos/listas2026/**"
      - "BancoDeQuestoes/figuras/LO26_*"
      - "tools/generate_lancamento_obliquo_listas_2026.R"
      - "tools/rewrite_lancamento_obliquo_moodle.py"
      - "DESCRIPTION"
      - ".github/workflows/lancamento-obliquo-listas-2026.yml"
  workflow_dispatch:
    inputs:
      variants:
        description: "Variantes por questão-base"
        required: false
        default: "20"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: lancamento-obliquo-2026-1
          dependencies: '"all"'
      - name: Gerar e validar XMLs dedicados
        run: |
          N="${{ github.event.inputs.variants || '20' }}"
          Rscript tools/generate_lancamento_obliquo_listas_2026.R "$N"
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=sorted(Path('build/lancamento-obliquo-listas-2026').glob('*.xml'))
          if not files:
              raise SystemExit('nenhum XML gerado')
          for p in files:
              s=p.read_text(encoding='utf-8')
              cats=re.findall(r'<text>\$course\$/[^<]+/(Q\d{2})</text>',s)
              names=re.findall(r'<name>\s*<text>(Q\d{2}-R\d{3})</text>',s,re.S)
              if not cats or not names:
                  raise SystemExit(f'{p}: categorias/nomeação Qxx ausentes')
              print(p, len(set(cats)), 'categorias-base', len(names), 'variantes')
          PY
      - name: Upload XMLs
        uses: actions/upload-artifact@v4
        with:
          name: lancamento-obliquo-listas-2026-moodle
          path: build/lancamento-obliquo-listas-2026/*.xml
