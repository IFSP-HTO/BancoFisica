name: tmp extract Unicamp 2024 Q39 continuation

on:
  push:
    branches:
      - unicamp/2024-q39-visual

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install pymupdf
      - name: Download source
        run: |
          curl -L --fail --retry 3 \
            'https://www.curso-objetivo.br/vestibular/resolucao-comentada/unicamp/2024_1fase/unicamp2024_1fase_prova_RZ.pdf' \
            -o /tmp/unicamp2024.pdf
      - name: Inspect pages 8 and 9
        run: |
          mkdir -p tmp-unicamp-q39-page9
          python - <<'PY'
          import fitz
          from pathlib import Path
          d=fitz.open('/tmp/unicamp2024.pdf')
          out=Path('tmp-unicamp-q39-page9')
          rep=[]
          for pno in (8,9):
              p=d[pno-1]
              rep.append(f'PAGE {pno}')
              rep.append(p.get_text('text'))
              rep.append('IMAGES')
              for info in p.get_image_info(xrefs=True):
                  rep.append(repr(info))
                  x=info.get('xref',0)
                  if x:
                      data=d.extract_image(x)
                      ext=data.get('ext','bin')
                      (out/f'p{pno}-xref{x}.{ext}').write_bytes(data['image'])
              p.get_pixmap(dpi=180,alpha=False).save(out/f'page-{pno}.png')
          (out/'report.txt').write_text('\n'.join(rep),encoding='utf-8')
          PY
      - name: Commit inspection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-unicamp-q39-page9
          git commit -m 'tmp: inspect Q39 continuation page' || exit 0
          git push
