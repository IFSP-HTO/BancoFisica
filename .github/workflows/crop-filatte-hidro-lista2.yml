name: Crop verified original Filatte diagrams for Moodle Lista 2

on:
  push:
    branches: ['fix/lista2-figuras-filatte-2026-11-13']
    paths:
      - 'tools/crop_filatte_hidro_lista2.py'
      - 'data/filatte-hidrostatica-lista2-crops.json'
      - '.github/workflows/crop-filatte-hidro-lista2.yml'

permissions:
  contents: write

jobs:
  crop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests Pillow
      - name: Download, verify SHA-256 and crop original diagrams
        run: python tools/crop_filatte_hidro_lista2.py
      - name: Add verified figure PNGs and provenance audit to this repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BancoDeQuestoes/hidrostatica/Q105PascalForca.png \
                  BancoDeQuestoes/hidrostatica/Q106PascalDeslocamento.png \
                  BancoDeQuestoes/hidrostatica/Q107EmpuxoVolume.png \
                  BancoDeQuestoes/hidrostatica/Q108PesoAparente.png \
                  BancoDeQuestoes/hidrostatica/Q109ClozeFracaoSubmersa.png \
                  data/filatte-hidrostatica-lista2-audit.json
          git commit -m 'Inclui cinco recortes auditados das figuras originais Filatte'
          git push origin HEAD:fix/lista2-figuras-filatte-2026-11-13
