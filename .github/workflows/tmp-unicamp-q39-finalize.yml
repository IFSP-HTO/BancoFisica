name: tmp finalize Unicamp 2024 Q39 asset

on:
  push:
    branches:
      - unicamp/2024-q39-visual

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preserve exact Q39 raster and clean temporary files
        run: |
          set -eux
          test -f tmp-unicamp-q39-page9/p9-xref64.png
          mkdir -p BancoDeQuestoes/figuras
          cp tmp-unicamp-q39-page9/p9-xref64.png BancoDeQuestoes/figuras/Unicamp2024_Q39_CorrenteDdp.png
          rm -rf tmp-unicamp-q39 tmp-unicamp-q39-page9
          rm -f tmp-unicamp-q39-trigger.txt tmp-q39-page9-trigger.txt tmp-q39-finalize-trigger.txt
          rm -f .github/workflows/tmp-unicamp-q39.yml .github/workflows/tmp-unicamp-q39-page9.yml .github/workflows/tmp-unicamp-q39-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add original Unicamp 2024 Q39 graph'
          git push
