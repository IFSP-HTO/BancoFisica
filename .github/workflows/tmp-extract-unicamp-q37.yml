name: tmp extract Unicamp 2024 Q37

on:
  push:
    branches:
      - unicamp/2024-q37-visual

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Download original exam PDF
        run: |
          curl -L --fail --retry 3 \
            'https://www.curso-objetivo.br/vestibular/resolucao-comentada/unicamp/2024_1fase/unicamp2024_1fase_prova_RZ.pdf' \
            -o /tmp/unicamp2024.pdf
      - name: Inspect Q37 graph geometry
        run: |
          mkdir -p tmp-q37
          python - <<'PY'
          import fitz
          doc = fitz.open('/tmp/unicamp2024.pdf')
          p = doc[7]
          out=[f'PAGE 8 size={p.rect.width}x{p.rect.height}']
          out.append('WORDS x<300 y>700:')
          for w in p.get_text('words'):
              if w[0] < 300 and w[1] > 700:
                  out.append(repr(w))
          out.append('DRAWINGS intersect x<300 y>700:')
          for d in p.get_drawings():
              r=d['rect']
              if r.x0 < 300 and r.y1 > 700:
                  out.append(f"rect={tuple(round(v,2) for v in r)} items={len(d.get('items',[]))} width={d.get('width')} color={d.get('color')} fill={d.get('fill')}")
          open('tmp-q37/geometry.txt','w',encoding='utf-8').write('\n'.join(out)+'\n')
          PY
      - name: Commit geometry report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-q37/geometry.txt
          git commit -m 'tmp: inspect Unicamp Q37 graph geometry' || exit 0
          git push
