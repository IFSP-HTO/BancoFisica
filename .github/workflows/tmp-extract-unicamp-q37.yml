name: tmp extract Unicamp 2024 Q37

on:
  push:
    branches:
      - unicamp/2024-q37-visual

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Download original exam PDF
        run: |
          curl -L --fail --retry 3 \
            'https://www.curso-objetivo.br/vestibular/resolucao-comentada/unicamp/2024_1fase/unicamp2024_1fase_prova_RZ.pdf' \
            -o /tmp/unicamp2024.pdf
      - name: Render pages around Q37
        run: |
          mkdir -p tmp-q37
          for p in 5 6 7 8 9 10; do
            python tools/pdf_assets.py page /tmp/unicamp2024.pdf --page "$p" --output "tmp-q37/page-${p}.png" --dpi 150 --force || true
          done
      - name: Commit inspection renders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-q37
          git commit -m 'tmp: render Unicamp Q37 source pages' || exit 0
          git push
