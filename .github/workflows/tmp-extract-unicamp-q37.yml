name: tmp extract Unicamp 2024 Q37

on:
  push:
    branches:
      - unicamp/2024-q37-visual

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Download original exam PDF
        run: |
          curl -L --fail --retry 3 \
            'https://www.curso-objetivo.br/vestibular/resolucao-comentada/unicamp/2024_1fase/unicamp2024_1fase_prova_RZ.pdf' \
            -o /tmp/unicamp2024.pdf
      - name: Extract original Q37 graph raster
        run: |
          mkdir -p BancoDeQuestoes/figuras
          python tools/pdf_assets.py extract /tmp/unicamp2024.pdf \
            --xref 59 \
            --output BancoDeQuestoes/figuras/Unicamp2024_Q37_FrequenciaLimite \
            --force
      - name: Commit extracted asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BancoDeQuestoes/figuras/Unicamp2024_Q37_FrequenciaLimite.*
          git commit -m 'feat: add original Unicamp 2024 Q37 graph' || exit 0
          git push
