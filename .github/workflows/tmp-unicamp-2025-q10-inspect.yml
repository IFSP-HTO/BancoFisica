name: tmp inspect Unicamp 2025 Q10

on:
  push:
    branches:
      - scratch/unicamp-2025-q10-inspect

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Download official Comvest commented exam
        run: |
          curl -L --fail --retry 3 \
            'https://www.comvest.unicamp.br/wp-content/uploads/2025/06/F1_2025.pdf' \
            -o /tmp/F1_2025.pdf
      - name: Inspect Q10 figures
        run: |
          rm -rf tmp-unicamp-2025-q10
          mkdir -p tmp-unicamp-2025-q10
          python - <<'PY'
          import fitz
          from pathlib import Path

          doc = fitz.open('/tmp/F1_2025.pdf')
          out = Path('tmp-unicamp-2025-q10')
          report=[]
          for pno in (13,14):
              page=doc[pno-1]
              report.append(f'PAGE {pno} size={page.rect.width}x{page.rect.height}')
              report.append('BLOCKS:')
              for b in page.get_text('blocks'):
                  report.append(repr(b))
              report.append('DRAWINGS:')
              for d in page.get_drawings():
                  report.append(f"rect={d['rect']} width={d.get('width')} color={d.get('color')} fill={d.get('fill')} items={len(d.get('items',[]))}")
              report.append('IMAGES:')
              for info in page.get_image_info(xrefs=True):
                  report.append(repr(info))
              report.append('---')
              page.get_pixmap(dpi=180, alpha=False).save(out/f'page-{pno}.png')
          (out/'report.txt').write_text('\n'.join(report),encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-unicamp-2025-q10
          git commit -m 'tmp: inspect official Comvest 2025 Q10 figures' || exit 0
          git push
