name: R tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: r-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BANK_CI_IMAGE_REPO: ghcr.io/ifsp-hto/bancofisica-ci
  # Benchmark #159: 4 workers reduced the full compilation from ~28m36s to ~9m46s.
  # Use BANK_JOBS=1 with tests/run_tests_parallel.R for serial reproduction/debug.
  BANK_JOBS: 4
  BANK_CACHE_DIR: .cache/bancofisica-ci
  R_KEEP_PKG_SOURCE: yes
  NOT_CRAN: true
  BANK_VALIDATE_FAIL_ON_ERRORS: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test CI scope and cache fingerprints
        run: |
          python3 tools/test_ci_test_scope.py
          python3 tools/test_ci_compile_cache.py

      - name: Detect affected questions
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 tools/ci_test_scope.py \
              --full \
              --manifest build/ci-test-files.txt \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > build/ci-changed-files.txt
          else
            if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              PUSH_BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -n "$PUSH_BEFORE" ]]; then
              git diff --name-only "$PUSH_BEFORE" "$CURRENT_SHA" > build/ci-changed-files.txt
            else
              git ls-files > build/ci-changed-files.txt
            fi
          fi

          echo "Changed files:"
          cat build/ci-changed-files.txt
          python3 tools/ci_test_scope.py \
            --changed-files build/ci-changed-files.txt \
            --manifest build/ci-test-files.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Report CI scope
        shell: bash
        run: |
          echo "### BancoFisica test scope" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: **${{ steps.scope.outputs.mode }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Test profile: **${{ steps.scope.outputs.test_profile }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Questions selected: **${{ steps.scope.outputs.question_count }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ steps.scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s build/ci-test-files.txt ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '<details><summary>Selected questions</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- `/' build/ci-test-files.txt | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure compile cache
        if: steps.scope.outputs.mode != 'none'
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "BANK_COMPILE_CACHE=0" >> "$GITHUB_ENV"
            echo "Scheduled/manual full run: compile cache disabled for reference validation."
          else
            echo "BANK_COMPILE_CACHE=1" >> "$GITHUB_ENV"
            echo "Content-addressed compile cache enabled."
          fi

      - name: Restore compile cache
        if: steps.scope.outputs.mode != 'none' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v4
        with:
          path: .cache/bancofisica-ci
          key: bancofisica-compile-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bancofisica-compile-v1-${{ runner.os }}-

      - name: Validate public demo site data
        run: |
          python3 tools/generate_demo_site_data.py
          python3 tools/validate_public_site.py

      - name: Select prebuilt CI image
        if: steps.scope.outputs.mode != 'none'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(sha256sum docker/ci/Dockerfile DESCRIPTION | sha256sum | awk '{print $1}')"
          image="${BANK_CI_IMAGE_REPO}:env-${fingerprint}"
          echo "BANK_CI_IMAGE=${image}" >> "$GITHUB_ENV"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "Using CI environment ${image}"

      - name: Log in to GHCR
        if: steps.scope.outputs.mode != 'none'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Prepare prebuilt CI image
        if: steps.scope.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          pulled=false
          for attempt in 1 2 3; do
            if docker pull "$BANK_CI_IMAGE"; then
              pulled=true
              break
            fi
            sleep 10
          done

          if [[ "$pulled" != true ]]; then
            echo "Image $BANK_CI_IMAGE is not published yet; building this environment once for validation."
            docker build -f docker/ci/Dockerfile -t "$BANK_CI_IMAGE" .
          fi

          image_id="$(docker image inspect "$BANK_CI_IMAGE" --format '{{.Id}}')"
          test -n "$image_id"
          echo "BANK_CACHE_ENV_FINGERPRINT=${image_id}" >> "$GITHUB_ENV"
          echo "Exact cache environment: ${image_id}"

      - name: Verify prebuilt CI environment
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm "$BANK_CI_IMAGE" bash -lc '
            set -euo pipefail
            Rscript -e '\''stopifnot(getRversion() == package_version("4.4.3")); pkgs <- c("exams", "stringr", "magrittr", "purrr", "callr", "tth", "base64enc", "testthat", "shiny", "xml2"); stopifnot(all(vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)))'\''
            latexmk -v >/dev/null
            qpdf --version >/dev/null
            pandoc --version >/dev/null
          '

      - name: Run BancoFisica tests
        if: steps.scope.outputs.mode != 'none'
        env:
          BANK_TEST_MODE: ${{ steps.scope.outputs.mode }}
          BANK_TEST_PROFILE: ${{ steps.scope.outputs.test_profile }}
          BANK_TEST_MANIFEST: build/ci-test-files.txt
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -e BANK_VALIDATE_FAIL_ON_ERRORS \
            -e BANK_TEST_MODE \
            -e BANK_TEST_PROFILE \
            -e BANK_TEST_MANIFEST \
            -e BANK_JOBS \
            -e BANK_COMPILE_CACHE \
            -e BANK_CACHE_DIR \
            -e BANK_CACHE_ENV_FINGERPRINT \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript tests/run_tests_parallel.R

      - name: Report compile cache
        if: always() && steps.scope.outputs.mode != 'none'
        shell: bash
        run: |
          if [[ -f build/compile-cache/summary.csv ]]; then
            python3 - <<'PY'
          import csv, os
          with open('build/compile-cache/summary.csv', encoding='utf-8') as f:
              row = next(csv.DictReader(f))
          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a', encoding='utf-8') as out:
              out.write('\n### Compile cache\n')
              out.write(f"- Enabled: **{row['enabled']}**\n")
              out.write(f"- Hits: **{row['hits']}**\n")
              out.write(f"- Misses: **{row['misses']}**\n")
              out.write(f"- Compilations executed: **{row['executed']}**\n")
              out.write(f"- New successful entries: **{row['writes']}**\n")
              out.write(f"- Reason: {row['reason']}\n")
          PY
          fi

      - name: Save compile cache
        if: success() && steps.scope.outputs.mode != 'none' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/save@v4
        with:
          path: .cache/bancofisica-ci
          key: bancofisica-compile-v1-${{ runner.os }}-${{ github.run_id }}

      - name: Audit solution blocks
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript tools/audit_solutions.R

      - name: Generate quality report
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript tools/quality_report.R --out-dir build/quality-report

      - name: Generate teaching audit
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript tools/audit_teaching.R --out-dir build/quality-report

      - name: Upload quality report
        if: steps.scope.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: banco-fisica-quality-report
          path: build/quality-report

      - name: Profile CI timings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BANK_PROFILE_MODE: ${{ steps.scope.outputs.mode }}
          BANK_PROFILE_QUESTION_COUNT: ${{ steps.scope.outputs.question_count }}
          BANK_PROFILE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          python3 tools/ci_profile.py \
            --out build/ci-profile.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload CI profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banco-fisica-ci-profile
          path: build/ci-profile.json
          if-no-files-found: ignore
