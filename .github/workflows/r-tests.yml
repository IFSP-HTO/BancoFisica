name: R tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: r-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  BANK_CI_IMAGE: ghcr.io/ifsp-hto/bancofisica-ci:r-4.4.3
  R_KEEP_PKG_SOURCE: yes
  NOT_CRAN: true
  BANK_VALIDATE_FAIL_ON_ERRORS: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect affected questions
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p build

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 tools/ci_test_scope.py \
              --full \
              --manifest build/ci-test-files.txt \
              --github-output "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" > build/ci-changed-files.txt
          else
            if [[ -z "$PUSH_BEFORE" || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              PUSH_BEFORE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
            if [[ -n "$PUSH_BEFORE" ]]; then
              git diff --name-only "$PUSH_BEFORE" "$CURRENT_SHA" > build/ci-changed-files.txt
            else
              git ls-files > build/ci-changed-files.txt
            fi
          fi

          echo "Changed files:"
          cat build/ci-changed-files.txt
          python3 tools/ci_test_scope.py \
            --changed-files build/ci-changed-files.txt \
            --manifest build/ci-test-files.txt \
            --github-output "$GITHUB_OUTPUT"

      - name: Report CI scope
        shell: bash
        run: |
          echo "### BancoFisica test scope" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: **${{ steps.scope.outputs.mode }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Questions selected: **${{ steps.scope.outputs.question_count }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ steps.scope.outputs.reason }}" >> "$GITHUB_STEP_SUMMARY"
          if [[ -s build/ci-test-files.txt ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '<details><summary>Selected questions</summary>' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            sed 's/^/- `/' build/ci-test-files.txt | sed 's/$/`/' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '</details>' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate public demo site data
        run: |
          python3 tools/generate_demo_site_data.py
          python3 tools/validate_public_site.py

      - name: Log in to GHCR
        if: steps.scope.outputs.mode != 'none'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Pull prebuilt CI image
        if: steps.scope.outputs.mode != 'none'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if docker pull "$BANK_CI_IMAGE"; then
              exit 0
            fi
            if [[ "$attempt" -eq 6 ]]; then
              echo "Failed to pull $BANK_CI_IMAGE after $attempt attempts" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Verify prebuilt CI environment
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm "$BANK_CI_IMAGE" bash -lc '
            set -euo pipefail
            Rscript -e '\''stopifnot(getRversion() == package_version("4.4.3")); pkgs <- c("exams", "stringr", "magrittr", "purrr", "callr", "tth", "base64enc", "testthat", "shiny", "xml2"); stopifnot(all(vapply(pkgs, requireNamespace, logical(1), quietly = TRUE)))'\''
            latexmk -v >/dev/null
            qpdf --version >/dev/null
            pandoc --version >/dev/null
          '

      - name: Run BancoFisica tests
        if: steps.scope.outputs.mode != 'none'
        env:
          BANK_TEST_MODE: ${{ steps.scope.outputs.mode }}
          BANK_TEST_MANIFEST: build/ci-test-files.txt
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -e BANK_VALIDATE_FAIL_ON_ERRORS \
            -e BANK_TEST_MODE \
            -e BANK_TEST_MANIFEST \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript -e 'source("tests/tests.R")'

      - name: Audit solution blocks
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript tools/audit_solutions.R

      - name: Generate quality report
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript tools/quality_report.R --out-dir build/quality-report

      - name: Generate teaching audit
        if: steps.scope.outputs.mode != 'none'
        run: |
          docker run --rm \
            -e R_KEEP_PKG_SOURCE \
            -e NOT_CRAN \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            "$BANK_CI_IMAGE" \
            Rscript tools/audit_teaching.R --out-dir build/quality-report

      - name: Upload quality report
        if: steps.scope.outputs.mode != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: banco-fisica-quality-report
          path: build/quality-report

      - name: Profile CI timings
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BANK_PROFILE_MODE: ${{ steps.scope.outputs.mode }}
          BANK_PROFILE_QUESTION_COUNT: ${{ steps.scope.outputs.question_count }}
          BANK_PROFILE_REASON: ${{ steps.scope.outputs.reason }}
        run: |
          python3 tools/ci_profile.py \
            --out build/ci-profile.json \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload CI profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: banco-fisica-ci-profile
          path: build/ci-profile.json
          if-no-files-found: ignore
