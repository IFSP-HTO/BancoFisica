name: FUVEST temporary asset extraction

on:
  push:
    branches:
      - fuvest-2026-fidelidade
    paths:
      - .github/workflows/fuvest-assets-temp.yml
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/fuvest-assets-temp.yml

permissions:
  contents: write

jobs:
  extract-f01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fuvest-2026-fidelidade

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyMuPDF
        run: python -m pip install pymupdf

      - name: Download official FUVEST 2026 second-phase PDF
        run: |
          curl -L --fail --retry 5 --retry-delay 2 \
            -A 'Mozilla/5.0' \
            'https://www.fuvest.br/wp-content/uploads/fuvest2026-fase2-dia2-prova.pdf' \
            -o /tmp/fuvest2026-fase2-dia2-prova.pdf
          file /tmp/fuvest2026-fase2-dia2-prova.pdf

      - name: Extract original F01 graph
        run: |
          python tools/pdf_assets.py crop /tmp/fuvest2026-fase2-dia2-prova.pdf \
            --page 10 \
            --bbox-percent 21.5 20.5 57 38 \
            --dpi 300 \
            --output BancoDeQuestoes/figuras/Q100ClozeFUVEST2026PipocaArrastoGrafico.png \
            --provenance --force

      - name: Extract original F01 experimental photo
        run: |
          python tools/pdf_assets.py crop /tmp/fuvest2026-fase2-dia2-prova.pdf \
            --page 10 \
            --bbox-percent 72.5 11.5 95.5 36.5 \
            --dpi 300 \
            --output BancoDeQuestoes/figuras/Q100ClozeFUVEST2026PipocaArrastoMontagem.png \
            --provenance --force

      - name: Upload F01 assets for visual inspection
        uses: actions/upload-artifact@v4
        with:
          name: fuvest-f01-assets
          path: |
            BancoDeQuestoes/figuras/Q100ClozeFUVEST2026PipocaArrastoGrafico.png*
            BancoDeQuestoes/figuras/Q100ClozeFUVEST2026PipocaArrastoMontagem.png*

      - name: Commit extracted assets
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BancoDeQuestoes/figuras/Q100ClozeFUVEST2026PipocaArrasto*.png*
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'assets: extrai figuras originais FUVEST 2026 F01'
            git push origin HEAD:fuvest-2026-fidelidade
          fi
