name: Importar questao de optica (Filatte)
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL da questao para importacao piloto
        required: true
        default: https://provas.professorfilatte.com.br/santa-casa-2027-fisica-questao-66
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Obter pagina e imagem original (aborta se falhar)
        env:
          QUESTION_URL: ${{ inputs.url }}
        run: python tools/import_filatte.py --url "$QUESTION_URL"
      - name: Conferir integridade do PNG e estrutura Rnw
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          report = json.loads(Path("import-filatte-report.json").read_text())
          img = Path("BancoDeQuestoes/figuras") / report["image_name"]
          with Image.open(img) as im:
              im.verify()
          questions = list(Path("BancoDeQuestoes/optica").glob("QSCSantaCasa2027Q66Refracao.Rnw"))
          assert len(questions) == 1
          rnw = questions[0].read_text()
          assert report["image_name"] in rnw
          assert "SOURCE-VISUAL: original-extract" in rnw
          assert "\\exsolution{00010}" in rnw
          print("PNG original verificado e metadados da questao conferidos")
          PY
      - name: Criar pull request para revisao (nao efetua merge)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH="import/filatte-santa-casa-2027-q66"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add BancoDeQuestoes/optica/QSCSantaCasa2027Q66Refracao.Rnw BancoDeQuestoes/figuras/SantaCasa2027Q66Original.png
          git commit -m "Import Santa Casa 2027 Q66 with source image"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base master --head "$BRANCH" \
            --title "Optica: Santa Casa 2027 Q66 com imagem original" \
            --body "Importacao piloto da questao 66. A imagem PNG original foi baixada sem reencodificacao. Revisar visualmente o arquivo para confirmar enquadramento adequado (sem texto duplicado), direitos de uso e executar exames2pdf/exams2moodle antes do merge. Este PR NAO deve ser mesclado sem essa verificacao."
