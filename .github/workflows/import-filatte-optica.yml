name: Estagiar questões de Óptica do Filatte
on:
  pull_request:
    paths:
      - 'tools/stage_filatte_optica.py'
      - 'data/filatte-optica-piloto.json'
      - '.github/workflows/import-filatte-optica.yml'
  push:
    branches:
      - feat/importador-filatte-optica
    paths:
      - 'tools/stage_filatte_optica.py'
      - 'data/filatte-optica-piloto.json'
      - '.github/workflows/import-filatte-optica.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Baixar fontes originais e conferir gabaritos
        run: python tools/stage_filatte_optica.py --manifest data/filatte-optica-piloto.json
      - name: Guardar material para revisão sem publicar questões
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filatte-optica-fonte-4-questoes
          path: build/filatte-stage/
          if-no-files-found: warn
