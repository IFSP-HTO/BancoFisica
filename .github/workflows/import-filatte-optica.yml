name: Estagiar questões de Óptica do Filatte
on:
  pull_request:
    paths:
      - 'tools/stage_filatte_optica.py'
      - 'data/filatte-optica-piloto.json'
      - 'data/filatte-optica-crops-2027.json'
      - 'tools/crop_filatte_optica.py'
      - '.github/workflows/import-filatte-optica.yml'
  push:
    branches:
      - feat/importador-filatte-optica
    paths:
      - 'tools/stage_filatte_optica.py'
      - 'data/filatte-optica-piloto.json'
      - 'data/filatte-optica-crops-2027.json'
      - 'tools/crop_filatte_optica.py'
      - '.github/workflows/import-filatte-optica.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependências
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Baixar fontes originais e conferir gabaritos
        run: python tools/stage_filatte_optica.py --manifest data/filatte-optica-piloto.json
      - name: Recortar somente os diagramas conferidos e verificar hashes
        run: python tools/crop_filatte_optica.py
      - name: Guardar fontes e quatro diagramas para auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: filatte-optica-2027-3-questoes
          path: |
            build/filatte-stage/
            BancoDeQuestoes/figuras/Humanitas2027Q38Lente.png
            BancoDeQuestoes/figuras/Einstein2027Q38Endoscopia.png
            BancoDeQuestoes/figuras/Einstein2027Q38Fibra.png
            BancoDeQuestoes/figuras/Beneficencia2027Q39Eclipse.png
          if-no-files-found: warn
      - name: Criar branch temática somente com figuras verificadas
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          BRANCH="import/filatte-optica-2027-lote2"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch ja existe. Nenhuma imagem substituida."
            exit 0
          fi
          git fetch origin master
          git switch -c "$BRANCH" origin/master
          git add BancoDeQuestoes/figuras/Humanitas2027Q38Lente.png \
                  BancoDeQuestoes/figuras/Einstein2027Q38Endoscopia.png \
                  BancoDeQuestoes/figuras/Einstein2027Q38Fibra.png \
                  BancoDeQuestoes/figuras/Beneficencia2027Q39Eclipse.png
          git commit -m "Add four original cropped optics diagrams from three 2027 exams"
          git push -u origin "$BRANCH"
