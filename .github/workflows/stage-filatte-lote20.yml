name: Stage 20 optics questions 2026-2027
on:
  push:
    branches:
      - feat/optica-lote20-2026
    paths:
      - 'data/filatte-optica-lote20-2026.json'
      - 'data/filatte-optica-lote20-recortes.json'
      - '.github/workflows/stage-filatte-lote20.yml'
  pull_request:
    paths:
      - 'data/filatte-optica-lote20-2026.json'
      - 'data/filatte-optica-lote20-recortes.json'
      - '.github/workflows/stage-filatte-lote20.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Validate manifest and duplicates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("data/filatte-optica-lote20-2026.json").read_text())
          items = m["questions"]
          assert m["target_count"] == len(items) == 20
          ids = [r["id"] for r in items]
          urls = [r["url"] for r in items]
          assert len(set(ids)) == len(ids)
          assert len(set(urls)) == len(urls)
          assert all(r["subject"] == "Óptica" and r["correct"] in "ABCDE" for r in items)
          print("Preflight: 20 unique optics items and reviewed answer keys")
          PY
      - name: Download full original scans and verify PNG integrity
        run: |
          python tools/stage_filatte_optica.py \
            --manifest data/filatte-optica-lote20-2026.json \
            --out-dir build/filatte-lote20
      - name: Extract and verify 14 original diagram crops
        run: |
          python tools/crop_filatte_optica.py \
            --manifest data/filatte-optica-lote20-recortes.json \
            --stage-dir build/filatte-lote20 \
            --dest build/filatte-lote20-crops
      - name: Check existing figures without overwriting any pixels
        run: |
          python - <<'PY'
          import json, pathlib, shutil
          m=json.loads(pathlib.Path('data/filatte-optica-lote20-recortes.json').read_text())
          for entry in m['items']:
              for fig in entry['figures']:
                  name=fig['name']
                  incoming=pathlib.Path('build/filatte-lote20-crops')/name
                  final=pathlib.Path('BancoDeQuestoes/figuras')/name
                  if final.exists():
                      if final.read_bytes()!=incoming.read_bytes():
                          raise RuntimeError('Existing PNG differs from the source crop: '+name)
                  else:
                      final.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copyfile(incoming,final)
          print('All 14 cropped images are verified and preserved')
          PY
      - name: Upload original sources and audit manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optica-lote20-2026-sources
          path: |
            build/filatte-lote20/
            build/filatte-lote20-crops/
            BancoDeQuestoes/figuras/*2026*.png
            BancoDeQuestoes/figuras/*2027*.png
          if-no-files-found: warn
      - name: Commit reviewed diagram crops to PR branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import json, subprocess
          m=json.load(open("data/filatte-optica-lote20-recortes.json"))
          paths=["BancoDeQuestoes/figuras/"+x["name"] for e in m["items"] for x in e["figures"]]
          subprocess.run(["git","add","--",*paths],check=True)
          print("Staged",len(paths),"source-faithful diagrams")
          PY
          if git diff --cached --quiet; then
            echo "Original diagrams already committed."
          else
            git commit -m "Add 14 original cropped diagrams for optics batch 20"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
