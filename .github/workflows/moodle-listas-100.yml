name: Moodle listas 100 variantes

on:
  push:
    branches:
      - generate/moodle-listas-100
    paths:
      - ".github/workflows/moodle-listas-100.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    env:
      R_KEEP_PKG_SOURCE: yes
      NOT_CRAN: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: moodle-listas-100-1
          dependencies: '"all"'

      - name: Prepare selected question sources
        shell: bash
        run: |
          set -euo pipefail
          SRC="BancoDeQuestoes/trabalhopotencia"
          ROOT="build/list-sources"
          mkdir -p "$ROOT/lista1-trabalho" "$ROOT/lista2-potencia-rendimento" "$ROOT/lista3-energia-conservacao"

          for d in "$ROOT"/*; do
            find "$SRC" -maxdepth 1 -type f ! -iname '*.Rnw' -exec cp {} "$d"/ \;
          done

          cp "$SRC/Q01QuizTrab.Rnw" "$ROOT/lista1-trabalho/"
          cp "$SRC/Q04Trab.Rnw" "$ROOT/lista1-trabalho/"
          cp "$SRC/Q09Trab.Rnw" "$ROOT/lista1-trabalho/"
          cp "$SRC/Q10Trab.Rnw" "$ROOT/lista1-trabalho/"
          cp "$SRC/Q97ClozeTrabalhoForcas.Rnw" "$ROOT/lista1-trabalho/"
          cp "$SRC/Q98ClozeGraficoTrabalho.Rnw" "$ROOT/lista1-trabalho/"
          cp "$SRC/Q06Trab.Rnw" "$ROOT/lista1-trabalho/"
          cp "$SRC/Q92QuizBoltTrabalho.Rnw" "$ROOT/lista1-trabalho/"

          cp "$SRC/Q07Trabpot.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q99ClozePotenciaEscada.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q100QuizMesmoTrabalhoPotencias.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q90ClozePotenciaEnergiaCinetica.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q101ClozeRendimentoRodaAgua.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q91QuizCarroSolarPotencia.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q08Trabpot.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q05Trab.Rnw" "$ROOT/lista2-potencia-rendimento/"
          cp "$SRC/Q106ClozePotenciaAutomovelRendimento.Rnw" "$ROOT/lista2-potencia-rendimento/"

          cp "$SRC/Q102ClozeEnergiasPotenciais.Rnw" "$ROOT/lista3-energia-conservacao/"
          cp "$SRC/Q92QuizBoltTrabalho.Rnw" "$ROOT/lista3-energia-conservacao/"
          cp "$SRC/Q90ClozePotenciaEnergiaCinetica.Rnw" "$ROOT/lista3-energia-conservacao/"
          cp "$SRC/Q94QuizMolaLancadorVelocidade.Rnw" "$ROOT/lista3-energia-conservacao/"
          cp "$SRC/Q103ClozeMolaRampaEnergia.Rnw" "$ROOT/lista3-energia-conservacao/"
          cp "$SRC/Q105QuizEnergiaCineticaConstante.Rnw" "$ROOT/lista3-energia-conservacao/"
          cp "$SRC/Q104ClozeEnergiaDissipadaAtrito.Rnw" "$ROOT/lista3-energia-conservacao/"
          cp "$SRC/Q03QuizTrab.Rnw" "$ROOT/lista3-energia-conservacao/"

      - name: Generate 100 Moodle variants per source question
        run: |
          Rscript tools/generate_moodle_xml.R \
            --questions-dir build/list-sources \
            --seed 20260814 \
            --n 100 \
            --layout structured \
            --out-dir build/moodle-listas-100 \
            --zip \
            --check

      - name: Upload Moodle lists
        uses: actions/upload-artifact@v4
        with:
          name: banco-fisica-listas-moodle-100-variantes
          path: build/moodle-listas-100
