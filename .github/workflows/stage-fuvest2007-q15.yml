name: Stage official FUVEST 2007 Q15 diagrams
on:
  pull_request:
    paths:
      - '.github/workflows/stage-fuvest2007-q15.yml'
  push:
    branches:
      - work/fuvest2007-q15-figures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pymupdf pillow
      - name: Download official exam PDF and render question graphics
        run: |
          python - <<'PY'
          import requests,fitz,hashlib,json
          from pathlib import Path
          url="https://www.fuvest.br/wp-content/uploads/fuvest_2007_1fase_prova_V.pdf"
          response=requests.get(url,headers={"User-Agent":"Mozilla/5.0"},timeout=55)
          response.raise_for_status()
          content=response.content
          if not content.startswith(b"%PDF"): raise ValueError("Not an official PDF stream")
          dst=Path("build/fuvest-2007-q15")
          dst.mkdir(parents=True,exist_ok=True)
          doc=fitz.open(stream=content,filetype="pdf")
          if len(doc)<6: raise RuntimeError("PDF too short")
          page=doc[5]
          pix=page.get_pixmap(matrix=fitz.Matrix(2,2),alpha=False)
          pix.save(dst/"page6.png")
          digest=hashlib.sha256(content).hexdigest()
          assert digest=="e31eb27e18defa99b545c6cbf95ce2fa549619cb3e233dd802d7f82a35320b9d",digest
          from PIL import Image
          from io import BytesIO
          rendered=Image.open(BytesIO(pix.tobytes("png")))
          cuts=[
             ("FUVEST2007Q15CenaOriginal.png",(286,160,588,341)),
             ("FUVEST2007Q15AlternativasOriginal.png",(108,385,606,728)),
          ]
          folder=Path("BancoDeQuestoes/figuras")
          folder.mkdir(parents=True,exist_ok=True)
          for fname,box in cuts:
              import io
              b=io.BytesIO()
              rendered.crop(box).save(b,format="PNG")
              target=folder/fname
              if target.exists():
                  if target.read_bytes()!=b.getvalue(): raise ValueError("Source PNG crop changed "+fname)
              else:
                  target.write_bytes(b.getvalue())
              print("verified cropped original",fname,target.stat().st_size,hashlib.sha256(target.read_bytes()).hexdigest())
          print(json.dumps({"source":url,"page":6,"pages":len(doc),"sha256":digest,"width":pix.width,"height":pix.height}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuvest2007q15-original-source-page
          path: |
            build/fuvest-2007-q15
            BancoDeQuestoes/figuras/FUVEST2007Q15CenaOriginal.png
            BancoDeQuestoes/figuras/FUVEST2007Q15AlternativasOriginal.png
          if-no-files-found: warn
      - name: Publish audited source crops to feature branch
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BancoDeQuestoes/figuras/FUVEST2007Q15CenaOriginal.png BancoDeQuestoes/figuras/FUVEST2007Q15AlternativasOriginal.png
          if ! git diff --cached --quiet; then
            git commit -m "Preserve FUVEST 2007 Q15 source diagrams and five visual alternatives"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
