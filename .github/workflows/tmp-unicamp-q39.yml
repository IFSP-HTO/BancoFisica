name: tmp inspect Unicamp 2024 Q39

on:
  push:
    branches:
      - unicamp/2024-q39-visual

permissions:
  contents: write

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Download original exam PDF
        run: |
          curl -L --fail --retry 3 \
            'https://www.curso-objetivo.br/vestibular/resolucao-comentada/unicamp/2024_1fase/unicamp2024_1fase_prova_RZ.pdf' \
            -o /tmp/unicamp2024.pdf
      - name: Locate Q39 and inspect visual assets
        run: |
          rm -rf tmp-unicamp-q39
          mkdir -p tmp-unicamp-q39
          python - <<'PY'
          import fitz
          from pathlib import Path

          pdf = '/tmp/unicamp2024.pdf'
          out = Path('tmp-unicamp-q39')
          doc = fitz.open(pdf)
          candidate = None
          for pno, page in enumerate(doc, start=1):
              low = page.get_text('text').lower()
              if ('sinapse' in low or 'neurotransmiss' in low) and 'ddp' in low:
                  candidate = pno
                  break
          if candidate is None:
              raise SystemExit('No Q39 candidate page found')

          report = [f'Q39 START PAGE: {candidate}']
          for pno in range(candidate, min(candidate + 3, doc.page_count + 1)):
              page = doc[pno - 1]
              report.append(f'PAGE {pno} size={page.rect.width}x{page.rect.height}')
              report.append(page.get_text('text'))
              report.append('IMAGES:')
              infos = page.get_image_info(xrefs=True)
              for info in infos:
                  report.append(repr(info))
              report.append('---')
              page.get_pixmap(dpi=180, alpha=False).save(out / f'page-{pno:02d}.png')
              seen = set()
              for img in page.get_images(full=True):
                  xref = img[0]
                  if xref in seen:
                      continue
                  seen.add(xref)
                  try:
                      data = doc.extract_image(xref)
                  except Exception as exc:
                      report.append(f'cannot extract xref {xref}: {exc}')
                      continue
                  ext = data.get('ext', 'bin')
                  (out / f'page-{pno:02d}-xref-{xref}.{ext}').write_bytes(data['image'])
          (out / 'diagnostics.txt').write_text('\n'.join(report), encoding='utf-8')
          PY
      - name: Commit diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-unicamp-q39
          git commit -m 'tmp: inspect Unicamp 2024 Q39 continuation' || exit 0
          git push
