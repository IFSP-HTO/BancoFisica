name: tmp crop Unicamp 2025 Q10 visuals

on:
  push:
    branches:
      - scratch/unicamp-2025-q10-inspect

permissions:
  contents: write

jobs:
  crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python -m pip install pymupdf
      - name: Download official Comvest commented exam
        run: |
          curl -L --fail --retry 3 \
            'https://www.comvest.unicamp.br/wp-content/uploads/2025/06/F1_2025.pdf' \
            -o /tmp/F1_2025.pdf
      - name: Crop original Q10 figures
        run: |
          python tools/pdf_assets.py crop /tmp/F1_2025.pdf \
            --page 13 --bbox 315 686 552 753 \
            --output tmp-unicamp-2025-q10/Unicamp2025_Q10_FiguraA_TerraLua.png \
            --dpi 300 --force
          python tools/pdf_assets.py crop /tmp/F1_2025.pdf \
            --page 14 --bbox 28 72 283 258 \
            --output tmp-unicamp-2025-q10/Unicamp2025_Q10_FiguraB_Aceleracao.png \
            --dpi 300 --force
      - name: Commit crops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-unicamp-2025-q10/Unicamp2025_Q10_Figura*.png
          git commit -m 'tmp: crop official Comvest 2025 Q10 figures' || exit 0
          git push
