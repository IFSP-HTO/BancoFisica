name: Public site

on:
  push:
    branches:
      - master
    paths:
      - 'site/**'
      - 'BancoDeQuestoes/**'
      - 'tools/generate_demo_site_data.py'
      - 'tools/validate_public_site.py'
      - 'tools/question_counts.R'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate and validate public demo question catalog
        run: |
          python3 tools/generate_demo_site_data.py
          python3 tools/validate_public_site.py

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true

      - name: Assemble complete Pages artifact
        run: |
          rm -rf build/pages
          mkdir -p build/pages
          cp -a site/. build/pages/
          Rscript tools/question_counts.R --check --out-dir build/pages

      - name: Verify complete Pages artifact
        run: |
          test -f build/pages/index.html
          test -f build/pages/question-counts.svg
          test -f build/pages/question-counts.csv
          test -f build/pages/data/questoes-demo.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
