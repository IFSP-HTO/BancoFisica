name: Moodle - Lista Hidrostática 2º ano

on:
  push:
    branches: [master]
    paths:
      - 'BancoDeQuestoes/hidrostatica/**'
      - 'tools/generate_hidrostatica_lista2ano.R'
      - 'tools/embed_unresolved_moodle_images.py'
      - '.github/workflows/moodle-hidrostatica-lista2ano.yml'
  pull_request:
    branches: [master]
    paths:
      - 'BancoDeQuestoes/hidrostatica/**'
      - 'tools/generate_hidrostatica_lista2ano.R'
      - 'tools/embed_unresolved_moodle_images.py'
      - '.github/workflows/moodle-hidrostatica-lista2ano.yml'
  workflow_dispatch:
    inputs:
      variants:
        description: 'Versões por questão (1 a 100)'
        required: false
        default: '1'
      seed:
        description: 'Semente para sorteio'
        required: false
        default: '20261113'

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.3'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 'hidrostatica-lista2ano-1'
          dependencies: '"all"'
      - name: Gerar e validar XML da lista
        env:
          VARIANTS: ${{ github.event.inputs.variants || '1' }}
          SEED: ${{ github.event.inputs.seed || '20261113' }}
        run: |
          Rscript tools/generate_hidrostatica_lista2ano.R \
            --n "$VARIANTS" --seed "$SEED" \
            --out-dir build/moodle-hidrostatica-lista-2ano
      - name: Publicar pacote Moodle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moodle-hidrostatica-lista-2ano
          path: build/moodle-hidrostatica-lista-2ano/
          if-no-files-found: error
